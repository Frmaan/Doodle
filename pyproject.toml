[project]
name = "sketch-recognition"
version = "0.1.0"
description = "Hand-drawn sketch recognition using a PyTorch CNN and Gradio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=6.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.scripts]
sketch-recognition = "sketch_recognition:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
#torch = { index = "pytorch-cu126" }
torch = { index = "pytorch-cpu" }
#torchvision = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
#name = "pytorch-cu126"
name = "pytorch-cpu"
#url = "https://download.pytorch.org/whl/cu126"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
